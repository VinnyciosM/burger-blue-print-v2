# Publica o site no GitHub Pages a cada atualização da branch main.
# Antes do primeiro uso: no GitHub, abra Settings > Pages e, em "Source", escolha "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar na mão, pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; uma nova substitui a que ainda está na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # "npm install" (e não "npm ci"): o package-lock.json gerado no Windows não traz alguns pacotes opcionais
      # que o Linux do GitHub pede (@emnapi/*), e o "npm ci" recusa um lock incompleto.
      - run: npm install --no-audit --no-fund

      - name: Gerar o site
        run: npm run build
        env:
          # Endereço do site: /nome-do-repositorio/
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
